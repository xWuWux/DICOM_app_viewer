name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint (bash syntax + compose config validation)
        run: ./scripts/lint.sh

  smoke-test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test (brings the stack up, checks the endpoints)
        run: ./scripts/smoke-test.sh
