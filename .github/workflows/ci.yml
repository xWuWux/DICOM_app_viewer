name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint (bash syntax + compose config validation)
        run: ./scripts/lint.sh

  unit-test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # matches docker/grading-api/Dockerfile's own base image
      - name: Unit test grading-api's state machine (issue #8)
        run: ./scripts/test-grading-api.sh

  shell-test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats
      - name: BATS test the Kasm workspace launcher scripts (issue #16)
        run: ./scripts/test-shell-scripts.sh

  smoke-test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test (brings the stack up, checks the endpoints)
        run: ./scripts/smoke-test.sh
