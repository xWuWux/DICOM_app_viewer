[pytest]
# Every meaningfully distinct panel state is already fully deterministic
# (frozen clock, fixed viewport, same pinned Playwright docker image every
# run -- see scripts/test-visual-regression.sh) -- no tolerance needed
# beyond guarding against trivial font-rendering/anti-aliasing noise
# between runs on the exact same image.
playwright_visual_snapshot_threshold = 0.02
playwright_visual_snapshots_path = __snapshots__
playwright_visual_snapshot_failures_path = __snapshot_failures__
