<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>IP_CMC DICOM Viewer</title>
<style>
  /* Deterrence, not prevention: see CLAUDE.md / Dokumentacja for why this is attribution-layer only. */
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000; }
  #frame { position:absolute; inset:0; width:100%; height:100%; border:0; }

  /* mix-blend-mode:difference guarantees contrast against ANY underlying
     content (white page -> dark text, black page -> light text, any color
     -> its complement) — a fixed color/opacity went invisible on Orthanc's
     white UI (see git log), which defeats a forensic watermark entirely.

     This is plain DOM text rotated with CSS, not canvas-drawn glyphs: a
     rotated <canvas> render looked "squished"/degraded once actually
     streamed through Kasm's video codec (thin diagonal strokes are exactly
     what lossy video compression mangles — the same class of problem the
     docs flagged for DICOM pixel fidelity, just biting our own watermark
     text here). DOM text uses the same rendering + font hinting pipeline
     as the rest of the page, so it survives the stream the same way the
     surrounding "ORTHANC" UI text does. */
  #watermark-rotator {
    position:absolute; top:-50%; left:-50%; width:200%; height:200%;
    transform: rotate(-15deg);
    pointer-events:none; z-index:10; mix-blend-mode:difference;
    overflow:hidden;
  }
  #watermark-grid {
    display:flex; flex-wrap:wrap; align-content:flex-start;
    width:100%; height:100%;
  }
  .wm-cell {
    color:#fff;
    font: bold 15px monospace;
    white-space:nowrap;
    flex: 0 0 auto;
    padding: 160px 220px; /* sparse tiling on purpose — a mark, not a wall of text */
    opacity: 0.3; /* still guaranteed-contrast via mix-blend-mode, just softer */
  }

  /* Reduce (not eliminate) casual copy/print attempts inside this session's own browser */
  * { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  @media print { body::before { content:"Printing disabled for this session."; } #frame,#watermark-rotator{display:none;} }
</style>
</head>
<body>
  <iframe id="frame" src="" allow="fullscreen"></iframe>
  <div id="watermark-rotator"><div id="watermark-grid"></div></div>

<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const studentId = params.get("student_id") || "UNKNOWN_STUDENT";
  const sessionId = params.get("session_id") || "UNKNOWN_SESSION";
  // Orthanc lives on its own origin (see nginx.conf comment on why it isn't
  // reverse-proxied under a subpath). Defaults to this machine's local test
  // setup; the Kasm launcher (custom_startup.sh) passes the real internal
  // address per deployment via this same query param.
  const orthancUrl = params.get("orthanc_url") || "http://localhost:8043/";
  document.getElementById("frame").src = orthancUrl;

  const rotator = document.getElementById("watermark-rotator");
  const grid = document.getElementById("watermark-grid");
  const CELL_W = 900, CELL_H = 420; // approximate — real layout wraps via flexbox

  function rebuildGrid() {
    // watermark-rotator is 2x the viewport in both dimensions (to stay fully
    // covered after rotation), so size the grid off its own rendered box,
    // not the viewport.
    const cols = Math.ceil(rotator.clientWidth / CELL_W) + 1;
    const rows = Math.ceil(rotator.clientHeight / CELL_H) + 1;
    const needed = cols * rows;
    while (grid.children.length < needed) {
      const span = document.createElement("span");
      span.className = "wm-cell";
      grid.appendChild(span);
    }
    while (grid.children.length > needed) {
      grid.removeChild(grid.lastChild);
    }
  }
  window.addEventListener("resize", rebuildGrid);
  rebuildGrid();

  function updateWatermarkText() {
    const text = `${studentId} | ${sessionId} | ${new Date().toISOString()}`;
    for (const cell of grid.children) cell.textContent = text;
  }

  updateWatermarkText();
  setInterval(updateWatermarkText, 1000);

  // Anti-tamper: reload if the watermark is hidden or removed from the DOM.
  // NOTE: this deters casual DOM tampering; it does NOT stop a camera photo of the
  // screen or a determined attacker disabling JS. See Dokumentacja for the full
  // threat-model discussion — attribution via the watermark is the real control.
  const observer = new MutationObserver(() => {
    if (!document.body.contains(rotator) ||
        rotator.style.display === "none" ||
        rotator.style.visibility === "hidden") {
      window.location.reload();
    }
  });
  observer.observe(document.body, { childList: true, attributes: true, subtree: true });

  // Best-effort deterrents (all bypassable locally, kept for friction + audit signal)
  document.addEventListener("contextmenu", e => e.preventDefault());
  document.addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    if (e.key === "PrintScreen" || (e.ctrlKey && ["p","s","c"].includes(k))) {
      e.preventDefault();
    }
  });
})();
</script>
</body>
</html>
