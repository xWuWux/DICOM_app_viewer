<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>IP_CMC DICOM Viewer</title>
<style>
  /* Deterrence, not prevention: see CLAUDE.md / Dokumentacja for why this is attribution-layer only. */
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000; }
  #frame { position:absolute; inset:0; width:100%; height:100%; border:0; }
  /* mix-blend-mode:difference guarantees contrast against ANY underlying
     content (white page -> dark text, black page -> light text, any color
     -> its complement) — a fixed color/opacity went invisible on Orthanc's
     white UI (see git log), which defeats a forensic watermark entirely. */
  #watermark {
    position:absolute; inset:0; width:100%; height:100%;
    pointer-events:none; z-index:10; mix-blend-mode:difference;
  }
  /* Reduce (not eliminate) casual copy/print attempts inside this session's own browser */
  * { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  @media print { body::before { content:"Printing disabled for this session."; } #frame,#watermark{display:none;} }
</style>
</head>
<body>
  <iframe id="frame" src="" allow="fullscreen"></iframe>
  <canvas id="watermark"></canvas>

<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const studentId = params.get("student_id") || "UNKNOWN_STUDENT";
  const sessionId = params.get("session_id") || "UNKNOWN_SESSION";
  // Orthanc lives on its own origin (see nginx.conf comment on why it isn't
  // reverse-proxied under a subpath). Defaults to this machine's local test
  // setup; the Kasm launcher (custom_startup.sh) passes the real internal
  // address per deployment via this same query param.
  const orthancUrl = params.get("orthanc_url") || "http://localhost:8043/";
  document.getElementById("frame").src = orthancUrl;

  const canvas = document.getElementById("watermark");
  const ctx = canvas.getContext("2d");

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  function drawWatermark() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const text = `${studentId} | ${sessionId} | ${new Date().toISOString()}`;
    ctx.font = "14px monospace";
    ctx.fillStyle = "#fff"; // color barely matters under mix-blend-mode:difference
    ctx.textBaseline = "top";

    // Tile the watermark across the whole canvas, diagonally, instead of one
    // rotating spot — a single instance is trivial to crop out of a
    // screenshot; a repeating tiled pattern covering the whole frame isn't.
    ctx.save();
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.rotate(-20 * Math.PI / 180);
    ctx.translate(-canvas.width / 2, -canvas.height / 2);

    const stepX = 340;
    const stepY = 90;
    // Drift the whole tile grid slowly so a static crop from one frame
    // doesn't reliably dodge every instance in the next.
    const drift = (Date.now() / 20000) % stepX;
    for (let y = -stepY; y < canvas.height + stepY; y += stepY) {
      for (let x = -stepX; x < canvas.width + stepX * 2; x += stepX) {
        ctx.fillText(text, x - drift, y);
      }
    }
    ctx.restore();
  }

  drawWatermark();
  setInterval(drawWatermark, 1000);

  // Anti-tamper: reload if the watermark canvas is hidden or removed from the DOM.
  // NOTE: this deters casual DOM tampering; it does NOT stop a camera photo of the
  // screen or a determined attacker disabling JS. See Dokumentacja for the full
  // threat-model discussion — attribution via the watermark is the real control.
  const observer = new MutationObserver(() => {
    if (!document.body.contains(canvas) ||
        canvas.style.display === "none" ||
        canvas.style.visibility === "hidden") {
      window.location.reload();
    }
  });
  observer.observe(document.body, { childList: true, attributes: true, subtree: true });

  // Best-effort deterrents (all bypassable locally, kept for friction + audit signal)
  document.addEventListener("contextmenu", e => e.preventDefault());
  document.addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    if (e.key === "PrintScreen" || (e.ctrlKey && ["p","s","c"].includes(k))) {
      e.preventDefault();
    }
  });
})();
</script>
</body>
</html>
