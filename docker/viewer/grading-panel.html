<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>IP_CMC Panel oceny</title>
<style>
  /* Issue #5 (Grading Panel): trimmed down from watermark.html -- this is
     the DICOM iframe removed, everything else about the grading panel kept
     as-is. Images now come from Weasis itself (a separate native window,
     launched by custom_startup.sh -- issue #4), not an iframe in this page.
     This page is meant to run as its own small browser window positioned
     beside Weasis, not full-screen kiosk.

     Deterrence, not prevention: see CLAUDE.md / Dokumentacja for why the
     watermark below is attribution-layer only. */
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#181818; }

  #grading-panel {
    position:absolute; inset:0;
    background:#181818; color:#eee;
    overflow-y:auto; box-sizing:border-box; padding:16px;
    font:14px/1.4 system-ui, sans-serif;
  }
  #grading-panel h2 { margin:0 0 4px; font-size:16px; }
  #grading-panel h3 { margin:12px 0 4px; font-size:14px; }
  #grading-panel p { margin:4px 0; color:#ccc; }
  #grading-panel textarea, #grading-panel select {
    width:100%; box-sizing:border-box; margin:8px 0;
    background:#222; color:#eee; border:1px solid #444; border-radius:4px; padding:6px;
  }
  #grading-panel fieldset { border:1px solid #444; border-radius:4px; margin:8px 0; }
  #grading-panel button {
    width:100%; padding:8px; margin-top:8px;
    background:#2d6cdf; color:#fff; border:0; border-radius:4px; cursor:pointer; font-size:14px;
  }
  #grading-panel button:hover { background:#3a7bee; }
  .feedback-correct { color:#4caf50; }
  .feedback-incorrect { color:#e05252; }
  .error { color:#e05252; font-weight:bold; }

  /* Visually separate boxes for "your answer" vs "real diagnosis" -- the
     point of the learning stage is comparing the two, so they need to read
     as distinct blocks, not just stacked paragraphs. */
  .answer-box {
    border:1px solid #444; border-radius:4px; padding:8px 10px; margin:6px 0 14px;
    background:#20202a;
  }
  .answer-box.reference { background:#1a2a1f; border-color:#3a5a40; }
  .answer-box p { margin:0; white-space:pre-wrap; }

  /* Same DOM-text (not canvas) watermark as watermark.html, unchanged --
     see that file's comment for why: mix-blend-mode:difference for
     guaranteed contrast, plain rotated DOM text because a rotated canvas
     render degrades once streamed through Kasm's video codec.

     IMPORTANT -- known interim gap, not silently accepted: this only
     covers THIS window. It does not, and cannot, cover Weasis's separate
     native window. Issue #6 ("Watermark Overlay") replaces this with a
     single always-on-top overlay spanning the whole desktop; until that
     ships, a Weasis session isn't fully watermarked end-to-end even though
     this panel is. Kept here in the meantime (rather than dropped) because
     partial coverage beats none, and CLAUDE.md's hard rule is "mandatory
     for every streamed session" -- removing it here with nothing yet in
     its place would be a straightforward violation of that rule. */
  #watermark-rotator {
    position:absolute; top:-50%; left:-50%; width:200%; height:200%;
    transform: rotate(-15deg);
    pointer-events:none; z-index:10; mix-blend-mode:difference;
    overflow:hidden;
  }
  #watermark-grid {
    display:flex; flex-wrap:wrap; align-content:flex-start;
    width:100%; height:100%;
  }
  .wm-cell {
    color:#fff;
    font: bold 13px monospace;
    white-space:nowrap;
    flex: 0 0 auto;
    padding: 70px 60px; /* denser than watermark.html's 160px/220px -- this
                           window is much smaller (a sidebar, not a full
                           viewport), so the same tile size would leave most
                           of it with zero coverage */
    opacity: 0.3;
  }

  /* Reduce (not eliminate) casual copy/print attempts inside this window */
  * { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  #grading-panel, #grading-panel * { user-select:text; } /* students still need to type/select answers */
  @media print { body::before { content:"Printing disabled for this session."; } #grading-panel,#watermark-rotator{display:none;} }
</style>
</head>
<body>
  <div id="grading-panel"><p>Ładowanie danych...</p></div>
  <div id="watermark-rotator"><div id="watermark-grid"></div></div>

<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const studentId = params.get("student_id") || "UNKNOWN_STUDENT";
  const sessionId = params.get("session_id") || "UNKNOWN_SESSION";

  const rotator = document.getElementById("watermark-rotator");
  const grid = document.getElementById("watermark-grid");
  const CELL_W = 340, CELL_H = 210; // tuned for a small sidebar window, see CSS comment above

  function rebuildGrid() {
    const cols = Math.ceil(rotator.clientWidth / CELL_W) + 1;
    const rows = Math.ceil(rotator.clientHeight / CELL_H) + 1;
    const needed = cols * rows;
    while (grid.children.length < needed) {
      const span = document.createElement("span");
      span.className = "wm-cell";
      grid.appendChild(span);
    }
    while (grid.children.length > needed) {
      grid.removeChild(grid.lastChild);
    }
  }
  window.addEventListener("resize", rebuildGrid);
  rebuildGrid();

  function updateWatermarkText() {
    const text = `${studentId} | ${sessionId} | ${new Date().toISOString()}`;
    for (const cell of grid.children) cell.textContent = text;
  }

  updateWatermarkText();
  setInterval(updateWatermarkText, 1000);

  // Anti-tamper: reload if the watermark is hidden or removed from the DOM.
  const observer = new MutationObserver(() => {
    if (!document.body.contains(rotator) ||
        rotator.style.display === "none" ||
        rotator.style.visibility === "hidden") {
      window.location.reload();
    }
  });
  observer.observe(document.body, { childList: true, attributes: true, subtree: true });

  // Best-effort deterrents (all bypassable locally, kept for friction + audit signal)
  document.addEventListener("contextmenu", e => e.preventDefault());
  document.addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    if (e.key === "PrintScreen" || (e.ctrlKey && ["p","s","c"].includes(k))) {
      e.preventDefault();
    }
  });

  // ---- Lung-RADS grading panel ----
  // Unchanged from watermark.html except: no `frame` element to point at a
  // study -- Weasis (a separate native window) shows the images now, this
  // panel only ever renders the form. Talks to grading-api via the
  // same-origin /api/ proxy (see default.conf.template) -- no CORS needed.
  const panel = document.getElementById("grading-panel");
  const STAGE_LABELS = { learning: "Nauka", assessment: "Ocena", test: "Test" };

  let currentCase = null;
  let caseStartMs = null;

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }

  async function loadCase() {
    panel.innerHTML = "<p>Ładowanie danych...</p>";
    try {
      const res = await fetch(`/api/case?student_id=${encodeURIComponent(studentId)}`);
      if (!res.ok) {
        throw new Error(`HTTP ${res.status}: ${res.statusText}`);
      }
      const data = await res.json();
      if (data.complete) {
        await showResults();
        return;
      }
      currentCase = data;
      caseStartMs = Date.now();
      renderForm(data);
    } catch (err) {
      panel.innerHTML = `<p class="error">Błąd ładowania: ${err.message}</p><button id="retry-btn">Spróbuj ponownie</button>`;
      document.getElementById("retry-btn").addEventListener("click", loadCase);
    }
  }

  function renderForm(data) {
    let html = `<h2>${STAGE_LABELS[data.stage] || data.stage}</h2>`;
    html += `<p>${escapeHtml(data.title)} (${data.position} / ${data.total_in_stage})</p>`;

    if (data.stage === "learning") {
      html += `
        <label>Twoja ocena (tekst):</label>
        <textarea id="text-input" rows="8" placeholder="Wpisz swoją ocenę badania..."></textarea>
        <button id="submit-btn">Wyślij ocenę</button>`;
    } else {
      const options = data.category_options
        .map(([value, label]) => `<option value="${escapeHtml(value)}">${escapeHtml(label)}</option>`)
        .join("");
      html += `
        <label>Kategoria Lung-RADS:</label>
        <select id="category-input">${options}</select>
        <fieldset>
          <legend>Zmiana istotna klinicznie spoza płuc (modyfikator S)</legend>
          <label><input type="radio" name="modifier-s" value="yes"> Tak</label><br>
          <label><input type="radio" name="modifier-s" value="no" checked> Nie</label>
        </fieldset>
        <button id="submit-btn">Wyślij ocenę</button>`;
    }
    panel.innerHTML = html;
    document.getElementById("submit-btn").addEventListener("click", onSubmit);
  }

  async function onSubmit() {
    const timeSpentSeconds = (Date.now() - caseStartMs) / 1000;
    const body = {
      student_id: studentId,
      case_id: currentCase.case_id,
      stage: currentCase.stage,
      time_spent_seconds: timeSpentSeconds,
    };
    if (currentCase.stage === "learning") {
      body.text = document.getElementById("text-input").value;
    } else {
      body.category = document.getElementById("category-input").value;
      body.modifier_s = document.querySelector('input[name="modifier-s"]:checked').value === "yes";
    }

    try {
      const res = await fetch("/api/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!res.ok) {
        throw new Error(`HTTP ${res.status}: ${res.statusText}`);
      }
      const result = await res.json();
      renderFeedback(currentCase.stage, result, body);
    } catch (err) {
      panel.innerHTML = `<p class="error">Błąd zapisu: ${err.message}</p><button id="back-btn">Wróć</button>`;
      document.getElementById("back-btn").addEventListener("click", loadCase);
    }
  }

  function renderFeedback(stage, result, submitted) {
    let html = "";
    if (stage === "learning") {
      html = `<h3>Twoja ocena</h3>
        <div class="answer-box"><p>${escapeHtml(submitted.text)}</p></div>
        <h3>Opis referencyjny (prawdziwa diagnoza)</h3>
        <div class="answer-box reference"><p>${escapeHtml(result.reference_report)}</p></div>`;
    } else if (stage === "assessment") {
      const cls = result.correct ? "feedback-correct" : "feedback-incorrect";
      const label = result.correct ? "Poprawnie" : "Niepoprawnie";
      html = `<h3 class="${cls}">${label}</h3>
        <p>Kategoria referencyjna: ${escapeHtml(result.ground_truth_category)}${result.ground_truth_modifier_s ? " (S)" : ""}</p>`;
    } else {
      html = `<h3>Odpowiedź zapisana.</h3><p>Brak informacji zwrotnej w module testowym.</p>`;
    }
    html += `<button id="next-btn">Następny przypadek</button>`;
    panel.innerHTML = html;
    document.getElementById("next-btn").addEventListener("click", loadCase);
  }

  async function showResults() {
    try {
      const res = await fetch(`/api/results?student_id=${encodeURIComponent(studentId)}`);
      if (!res.ok) {
        throw new Error(`HTTP ${res.status}: ${res.statusText}`);
      }
      const data = await res.json();
      const pct = data.accuracy !== null ? `${Math.round(data.accuracy * 100)}%` : "brak danych";
      panel.innerHTML = `
        <h2>Wyniki końcowe</h2>
        <p>Wynik testu: ${data.test_correct} / ${data.test_total} (${pct})</p>
        <button id="restart-btn">Rozpocznij od początku</button>`;
      document.getElementById("restart-btn").addEventListener("click", async () => {
        try {
          await fetch("/api/reset", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ student_id: studentId }),
          });
          loadCase();
        } catch (err) {
          panel.innerHTML = `<p class="error">Błąd resetu: ${err.message}</p>`;
        }
      });
    } catch (err) {
      panel.innerHTML = `<p class="error">Błąd ładowania wyników: ${err.message}</p>`;
    }
  }

  loadCase();
})();
</script>
</body>
</html>
