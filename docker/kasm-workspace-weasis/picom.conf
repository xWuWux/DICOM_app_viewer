# picom for the watermark overlay (issue #150). Its ONLY job is to make the
# ARGB overlay window genuinely transparent: no effects of any kind, so the
# radiology image is never altered or delayed by cosmetics.
backend = "xrender";
vsync = false;
shadow = false;
fading = false;
inactive-opacity = 1;
frame-opacity = 1;
blur-background = false;
detect-client-opacity = false;
