# Optional: append after docker-compose.yml OR docker-compose.remote-host.yml.
# The file must be readable by container UID 10001, with mode 0400 or 0600.
# Local Compose file secrets preserve host ownership; uid/mode overrides do not
# fix a root-owned 0600 bind mount. See docs/SECRET_FILES.md before enabling.
services:
  grading-api:
    environment:
      GRADING_COORDINATOR_KEY: ""
      GRADING_COORDINATOR_KEY_FILE: /run/secrets/grading-coordinator-key
    secrets:
      - source: grading-coordinator-key
        target: grading-coordinator-key

secrets:
  grading-coordinator-key:
    file: ${GRADING_COORDINATOR_SECRET_PATH:?Set an absolute path to the private coordinator key file}
