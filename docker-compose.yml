
services:
  orthanc:
    image: orthancteam/orthanc:latest
    container_name: ipcmc-orthanc
    restart: unless-stopped
    environment:
      # Sets the "orthanc" user's password directly (image feature, no
      # RegisteredUsers block needed in orthanc.json). Comes from .env
      # (gitignored) -- see .env.example. No default here on purpose: this
      # is meant to fail loudly if you haven't set one, not silently run
      # with a known placeholder.
      - ORTHANC_PASSWORD=${ORTHANC_PASSWORD:?Set ORTHANC_PASSWORD in .env -- see .env.example}
    volumes:
      - ./docker/orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
      - orthanc-storage:/var/lib/orthanc/db
    networks:
      - ipcmc-internal
      - kasm_default_network
    ports:
      # Bound to localhost only: convenience for local testing/debugging so
      # the watermark wrapper's browser (running on this same machine) can
      # iframe Orthanc's own UI directly, avoiding subpath-proxy breakage
      # (Orthanc's Explorer2/Stone-Viewer assets assume they're served from
      # the root of their own origin). Reachability for Kasm's own session
      # containers comes from the kasm_default_network attachment above
      # instead (by container name, e.g. http://ipcmc-orthanc:8042/) — not
      # from this published port, which stays loopback-only.
      - "127.0.0.1:8042:8042"

  grading-api:
    build: ./docker/grading-api
    container_name: ipcmc-grading-api
    restart: unless-stopped
    volumes:
      - grading-db:/data
    networks:
      # Internal only -- no host port, no kasm_default_network. Nothing
      # outside viewer's nginx (which proxies /api/ to this) needs to reach
      # it directly, same least-exposure pattern as orthanc.
      - ipcmc-internal

  viewer:
    build: ./docker/viewer
    container_name: ipcmc-viewer
    restart: unless-stopped
    depends_on:
      - orthanc
      - grading-api
    environment:
      # Same password as the orthanc service above -- used to compute the
      # auth-injecting proxy's Basic-Auth header at container start (see
      # docker/viewer/15-compute-orthanc-auth.envsh), never hardcoded.
      - ORTHANC_PASSWORD=${ORTHANC_PASSWORD:?Set ORTHANC_PASSWORD in .env -- see .env.example}
    ports:
      - "8080:8080"   # This is the only thing that should ever be reachable directly for this MVP,
                       # and in the real deployment even this gets replaced by Kasm's own gateway —
                       # see README.md "From MVP to the real thing".
      - "127.0.0.1:8043:8043"   # Auth-injecting Orthanc proxy — loopback only. Publishing
                                 # this beyond localhost would hand out unauthenticated Orthanc
                                 # access to anyone who can reach it (see nginx.conf comment).
    networks:
      - ipcmc-internal
      - kasm_default_network

networks:
  ipcmc-internal:
    driver: bridge
  kasm_default_network:
    # Created by the Kasm Workspaces installer, not by this compose file —
    # attaching here is what lets Kasm's session containers reach `orthanc`
    # and `viewer` by container name (see comments above). If Kasm isn't
    # installed yet, comment this network out of both services above and
    # this block, and use `docker compose up` for local-only testing.
    external: true

volumes:
  orthanc-storage:
  grading-db:
